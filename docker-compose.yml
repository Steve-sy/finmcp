services:
  finmcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: finmcp
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - YF_MCP_HOST=0.0.0.0
      - YF_MCP_PORT=3333
      # - YF_MCP_API_KEY=your_secret_here  # Protect your endpoint with an API key
      # - MCP_TRANSPORT=stdio  # stdio mode
    ports:
      - "3333:3333"  # HTTP transport: MCP endpoint available at http://localhost:3333/mcp
    volumes:
      # Optional: inject a custom config file without rebuilding the image
      # - ./config.json:/app/config.json:ro
      # Optional: mount source for live editing (dev only)
      # - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

