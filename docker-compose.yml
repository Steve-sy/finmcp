version: '3.8'

services:
  finmcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: finmcp
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - YF_MCP_HOST=0.0.0.0
      - YF_MCP_PORT=3333
      # - MCP_TRANSPORT=stdio  # stdio mode
    ports:
      - "3333:3333"  # HTTP transport: MCP endpoint available at http://localhost:3333/mcp
    # Mount for development (comment out in production)
    volumes:
      - ./src:/app/src:ro
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # For development with hot reload (use dev stage)
    # command: npm run dev

  # Optional: Development service with hot reload
  finmcp-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: finmcp-dev
    profiles:
      - dev
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - YF_MCP_HOST=0.0.0.0
      - YF_MCP_PORT=3333
    ports:
      - "3333:3333"
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
    command: npm run dev
    networks:
      - mcp-network
    #stdin_open: true
    #tty: true

networks:
  mcp-network:
    driver: bridge

volumes:
  # Preserve node_modules for development
  node_modules:
